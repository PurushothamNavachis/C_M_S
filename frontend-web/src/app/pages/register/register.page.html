<ion-content>
  <div class="bg-slate-950 min-h-screen flex items-center justify-center py-16 px-6">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_120%,rgba(20,184,166,0.12),transparent)] z-0"></div>

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl relative z-10 space-y-6">
      <div class="text-center space-y-2">
        <h2 class="text-3xl font-extrabold text-white">Create Account</h2>
        <p class="text-sm text-slate-400">Register as a patient to schedule appointments and view medical records</p>
      </div>

      <form (submit)="onRegister()" class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Email Address</label>
          <input 
            type="email" 
            [(ngModel)]="registration.email" 
            name="email" 
            required
            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-white outline-none transition"
            placeholder="patient@email.com"
          />
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Username</label>
          <input 
            type="text" 
            [(ngModel)]="registration.username" 
            name="username" 
            required
            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-white outline-none transition"
            placeholder="e.g., patient123"
          />
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Password</label>
          <input 
            type="password" 
            [(ngModel)]="registration.password" 
            name="password" 
            required
            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-teal-500 focus:ring-1 focus:ring-teal-500 text-white outline-none transition"
            placeholder="Minimum 6 characters"
          />
        </div>

        <!-- Error Banner -->
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-xs font-semibold">
          ⚠️ {{ errorMessage }}
        </div>

        <button 
          type="submit" 
          [disabled]="loading"
          class="w-full py-3.5 bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-teal-500/20 transition flex items-center justify-center space-x-2"
        >
          <span *ngIf="loading" class="animate-spin inline-block w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full"></span>
          <span>{{ loading ? 'Creating Account...' : 'Register' }}</span>
        </button>
      </form>

      <div class="text-center text-xs text-slate-400">
        Already registered? 
        <a routerLink="/login" class="text-teal-400 font-bold hover:underline">Sign in here</a>
      </div>
    </div>
  </div>
</ion-content>
