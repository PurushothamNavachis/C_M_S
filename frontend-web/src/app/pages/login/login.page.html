<ion-content>
  <div class="bg-slate-50 min-h-screen flex items-center justify-center py-16 px-6">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_120%,rgba(74,222,128,0.1),transparent)] z-0"></div>

    <div class="bg-white border border-slate-200 p-8 rounded-3xl w-full max-w-md shadow-2xl relative z-10 space-y-6">
      <div class="text-center space-y-2">
        <h2 class="text-3xl font-black text-slate-900">Welcome Back</h2>
        <p class="text-sm text-slate-500">Log in to your account to access portal gateways</p>
      </div>

      <form (submit)="onLogin()" class="space-y-4">
        <div class="space-y-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Username or Email</label>
          <input 
            type="text" 
            [(ngModel)]="credentials.username_or_email" 
            name="username_or_email" 
            required
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-green-500 focus:ring-1 focus:ring-green-500 text-slate-900 outline-none transition"
            placeholder="e.g., sunny@gmail.com"
          />
        </div>

        <div class="space-y-1.5">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Password</label>
          <input 
            type="password" 
            [(ngModel)]="credentials.password" 
            name="password" 
            required
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-green-500 focus:ring-1 focus:ring-green-500 text-slate-900 outline-none transition"
            placeholder="••••••••"
          />
        </div>

        <!-- Error Banner -->
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/20 text-red-600 p-3 rounded-xl text-xs font-semibold">
          ⚠️ {{ errorMessage }}
        </div>

        <button 
          type="submit" 
          [disabled]="loading"
          class="w-full py-3.5 bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-50 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg shadow-green-600/20 transition flex items-center justify-center space-x-2"
        >
          <span *ngIf="loading" class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
          <span>{{ loading ? 'Authenticating...' : 'Sign In' }}</span>
        </button>
      </form>

      <div class="text-center text-xs text-slate-500">
        Don't have an account? 
        <a routerLink="/register" class="text-green-600 font-bold hover:underline">Register here</a>
      </div>
    </div>
  </div>
</ion-content>
